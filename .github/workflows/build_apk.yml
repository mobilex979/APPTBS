name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      # Buat scaffold Android otomatis (folder android/)
      - run: flutter create --platforms android --project-name nota_tbs_app .

      # Naikkan versi Kotlin agar kompatibel dengan Java 17 di server GitHub
      - name: Fix Kotlin version
        run: |
          sed -i 's/org.jetbrains.kotlin.android" version "[0-9.]*"/org.jetbrains.kotlin.android" version "1.9.24"/' android/settings.gradle
          grep kotlin android/settings.gradle

      - run: flutter pub get

      - run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nota-tbs-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
