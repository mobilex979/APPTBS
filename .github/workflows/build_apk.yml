name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      # Buat scaffold Android lengkap (folder android/ dibuat baru tiap build)
      - run: flutter create --platforms android --project-name nota_tbs_app .

      # Keystore tetap di ROOT repo -> salin ke android/app
      - run: cp buslin-keystore.p12 android/app/buslin-keystore.p12

      # Tulis key.properties agar APK release selalu ditandatangani sama
      - run: |
          cat > android/key.properties << 'EOF'
          storePassword=buslin2026
          keyPassword=buslin2026
          keyAlias=buslin
          storeFile=buslin-keystore.p12
          EOF

      # Naikkan versi Kotlin agar kompatibel Java 17
      - name: Fix Kotlin version
        run: |
          sed -i 's/org.jetbrains.kotlin.android" version "[0-9.]*"/org.jetbrains.kotlin.android" version "1.9.24"/' android/settings.gradle
          grep kotlin android/settings.gradle

      - run: flutter pub get

      - run: flutter build apk --release --obfuscate --split-debug-info=symbols

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nota-tbs-apk-release
          path: build/app/outputs/flutter-apk/app-release.apk
