# Build APK Nota Timbang TBS otomatis di cloud (GitHub Actions)
# Setiap Anda upload project ke GitHub, APK dibangun otomatis dalam ±10 menit.
name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # bisa juga dijalankan manual dari tab Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - run: flutter pub get

      - run: flutter build apk --release --obfuscate --split-debug-info=symbols

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nota-tbs-apk-release
          path: build/app/outputs/flutter-apk/app-release.apk
