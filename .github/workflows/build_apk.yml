name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: 'stable'

      # Buat scaffold Android lengkap (folder android/ dibuat baru tiap build)
      - run: flutter create --platforms android --org com.buslinbros --project-name bbapp_tbs .

      # Keystore tetap di ROOT repo -> salin ke android/app
      - run: cp buslin-keystore.p12 android/app/buslin-keystore.p12

      # Tulis key.properties agar APK release selalu ditandatangani sama
      - run: |
          cat > android/key.properties << 'EOF'
          storePassword=buslin2026
          keyPassword=buslin2026
          keyAlias=buslin
          storeFile=buslin-keystore.p12
          EOF

      # Aturan R8/ProGuard: cegah minify membuang kelas opsional ML Kit dll.
      - name: ProGuard rules
        run: |
          cat > android/app/proguard-rules.pro << 'EOF'
          # Aturan bawaan Flutter
          -keep class io.flutter.app.** { *; }
          -keep class io.flutter.plugin.** { *; }
          -keep class io.flutter.util.** { *; }
          -keep class io.flutter.view.** { *; }
          -keep class io.flutter.** { *; }
          -keep class io.flutter.plugins.** { *; }
          -dontwarn io.flutter.embedding.**
          # ML Kit text recognition: kelas script opsional (korea/cina/jepang/devanagari)
          -keep class com.google.mlkit.** { *; }
          -dontwarn com.google.mlkit.vision.text.korean.**
          -dontwarn com.google.mlkit.vision.text.chinese.**
          -dontwarn com.google.mlkit.vision.text.japanese.**
          -dontwarn com.google.mlkit.vision.text.devanagari.**
          -keep class com.google.android.gms.** { *; }
          -dontwarn com.google.android.gms.**
          # Library lain
          -dontwarn com.google.common.**
          -keep class androidx.** { *; }
          -dontwarn androidx.**
          EOF

      # Perbaiki perbedaan target Java/Kotlin plugin & NDK
      - name: Fix JVM target & NDK
        run: |
          echo "kotlin.jvm.target.validation.mode=warning" >> android/gradle.properties
          python3 - << 'PYEOF'
          p = 'android/app/build.gradle.kts'
          s = open(p).read()
          if 'ndkVersion' not in s:
              s = s.replace('android {', 'android {\n    ndkVersion = "27.0.12077973"', 1)
          open(p, 'w').write(s)
          PYEOF

      # Intent filter: agar file backup bisa dibuka langsung dari WA/file manager
      - name: Intent filter
        run: |
          python3 - << 'PYEOF'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          filt = ('<intent-filter>'
                  '<action android:name="android.intent.action.VIEW"/>'
                  '<category android:name="android.intent.category.DEFAULT"/>'
                  '<category android:name="android.intent.category.BROWSABLE"/>'
                  '<data android:scheme="content"/>'
                  '<data android:scheme="file"/>'
                  '</intent-filter>'
                  '<intent-filter>'
                  '<action android:name="android.intent.action.SEND"/>'
                  '<category android:name="android.intent.category.DEFAULT"/>'
                  '<data android:mimeType="*/*"/>'
                  '</intent-filter>')
          s = s.replace('</activity>', filt + '</activity>')
          open(p, 'w').write(s)
          PYEOF

      # Icon aplikasi: pohon sawit (digenerate tiap build)
      - name: App icon
        run: |
          pip -q install pillow
          python3 - << 'PYEOF'
          from PIL import Image, ImageDraw

          import os
          from PIL import Image, ImageDraw

          def gambar_icon(size):
              S = 512
              img = Image.new('RGBA', (S, S), (0, 0, 0, 0))
              d = ImageDraw.Draw(img)
              bg = Image.new('RGBA', (S, S), (0, 0, 0, 0))
              bd = ImageDraw.Draw(bg)
              for i in range(S):
                  t = i / S
                  r = int(0x2E + (0x1B - 0x2E) * t)
                  g = int(0x7D + (0x5E - 0x7D) * t)
                  b = int(0x32 + (0x20 - 0x32) * t)
                  bd.line([(0, i), (S, i)], fill=(r, g, b, 255))
              mask = Image.new('L', (S, S), 0)
              md = ImageDraw.Draw(mask)
              md.rounded_rectangle([8, 8, S-8, S-8], radius=110, fill=255)
              img.paste(bg, (0, 0), mask)
              cx, cy = S * 0.5, S * 0.46
              brown = (109, 76, 65, 255)
              d.line([(cx-6, cy+150), (cx-14, cy+60), (cx-4, cy-6)],
                     fill=brown, width=30, joint='curve')
              for t in range(5):
                  y = cy + 130 - t * 34
                  d.line([(cx-18, y), (cx+10, y-6)], fill=(141, 110, 99, 255), width=6)
              hijau_tua = (27, 94, 32, 255)
              hijau = (46, 125, 50, 255)
              daun = Image.new('RGBA', (S, S), (0, 0, 0, 0))
              for sudut in [-155, -110, -65, -20, 25, -135]:
                  leaf = Image.new('RGBA', (300, 90), (0, 0, 0, 0))
                  ld = ImageDraw.Draw(leaf)
                  ld.pieslice([10, -30, 300, 130], 180, 360, fill=hijau)
                  ld.arc([30, -10, 280, 110], 200, 340, fill=hijau_tua, width=6)
                  leaf = leaf.rotate(-sudut - 90, expand=False, resample=Image.BICUBIC)
                  daun.paste(leaf, (int(cx - 150), int(cy - 120)), leaf)
              img.paste(daun, (0, 0), daun)
              for dx, dy in [(-28, 8), (24, 4), (0, 22)]:
                  d.ellipse([cx+dx-24, cy+dy-24, cx+dx+24, cy+dy+24],
                            fill=(141, 110, 99, 255), outline=(109, 76, 65, 255), width=5)
              d.rounded_rectangle([cx-90, cy+148, cx+90, cy+176], radius=14,
                                  fill=(104, 159, 56, 255))
              return img.resize((size, size), Image.LANCZOS)

          for dpi, px in [('mdpi', 48), ('hdpi', 72), ('xhdpi', 96),
                          ('xxhdpi', 144), ('xxxhdpi', 192)]:
              d = f'android/app/src/main/res/mipmap-{dpi}'
              os.makedirs(d, exist_ok=True)
              gambar_icon(px).save(f'{d}/ic_launcher.png')
          print('icons OK')
          PYEOF

      # Nama tampilan aplikasi
      - name: App label
        run: |
          python3 - << 'PYEOF'
          import re
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          s = re.sub(r'android:label="[^"]*"', 'android:label="BBappTBS"', s)
          open(p, 'w').write(s)
          PYEOF

      - run: flutter pub get

      - run: flutter build apk --release --obfuscate --split-debug-info=symbols

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bbapp-apk
          path: build/app/outputs/flutter-apk/app-release.apk
