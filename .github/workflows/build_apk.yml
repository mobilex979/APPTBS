name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      # Buat scaffold Android otomatis (folder android/ yang sebelumnya kurang)
      - run: flutter create --platforms android --project-name nota_tbs_app .

      - run: flutter pub get

      - run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nota-tbs-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
